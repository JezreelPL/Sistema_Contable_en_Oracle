<!DOCTYPE html>
<html lang="es" class="h-full bg-[#faf5ee]" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${venta.id == null} ? 'Nueva venta' : 'Editar venta')}"></head>
<body class="min-h-full flex flex-col font-['Manrope'] text-[#3a302a] bg-[#faf5ee] antialiased">
<header th:replace="~{fragments/menu :: menu('ventas')}"></header>

<main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="text-3xl font-bold" th:text="${venta.id == null} ? 'Nueva venta' : 'Editar venta'">Nueva venta</h1>

    <div th:if="${error}" th:text="${error}" class="mt-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

    <form th:action="@{/ventas/guardar}" method="post" class="mt-6 space-y-5 rounded-2xl border border-[#ece6dc] bg-white p-6 shadow-sm">
        <input type="hidden" name="id" th:if="${venta.id != null}" th:value="${venta.id}">

        <div>
            <label for="idCliente" class="block text-sm font-semibold mb-1">Cliente</label>
            <select id="idCliente" name="idCliente" required
                    class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
                <option value="">Selecciona un cliente</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${venta.idCliente != null and venta.idCliente == c.id}"></option>
            </select>
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="fecha" class="block text-sm font-semibold mb-1">Fecha</label>
                <input id="fecha" type="date" name="fecha" required
                       th:value="${venta.fecha != null} ? ${#temporals.format(venta.fecha, 'yyyy-MM-dd')} : ''"
                       class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
            </div>
            <div>
                <label for="numeroFactura" class="block text-sm font-semibold mb-1">Número de factura</label>
                <input id="numeroFactura" type="text" name="numeroFactura" maxlength="30" required
                       th:value="${venta.numeroFactura}"
                       class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
            </div>
        </div>

        <div>
            <label for="formaPago" class="block text-sm font-semibold mb-1">Forma de pago</label>
            <select id="formaPago" name="formaPago" required
                    class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
                <option value="">Selecciona una forma de pago</option>
                <option th:each="f : ${formasPago}" th:value="${f}" th:text="${f}"
                        th:selected="${f == venta.formaPago}"></option>
            </select>
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="descuento" class="block text-sm font-semibold mb-1">Descuento</label>
                <input id="descuento" type="number" name="descuento" min="0" step="0.01"
                       th:value="${venta.descuento}"
                       class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
            </div>
            <div>
                <label for="total" class="block text-sm font-semibold mb-1">Total</label>
                <input id="total" type="number" name="total" min="0.01" step="0.01" required
                       th:value="${venta.total}"
                       class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit"
                    class="px-4 py-2 rounded-xl bg-gradient-to-r from-[#c2652a] to-[#8a4518] text-white text-sm font-semibold shadow-sm hover:shadow-md nav-btn-transition">Guardar</button>
            <a th:href="@{/ventas}" class="px-4 py-2 rounded-xl border border-[#ece6dc] text-sm font-semibold text-[#605850] hover:bg-[#f2ece4] nav-btn-transition">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
