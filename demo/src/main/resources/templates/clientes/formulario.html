<!DOCTYPE html>
<html lang="es" class="h-full bg-[#faf5ee]" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body class="min-h-full flex flex-col font-['Manrope'] text-[#3a302a] bg-[#faf5ee] antialiased">
<header th:replace="~{fragments/menu :: menu('clientes')}"></header>

<main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="text-3xl font-bold" th:text="${cliente.idCliente != null ? 'Editar cliente' : 'Nuevo cliente'}">Nuevo cliente</h1>

    <div th:if="${error}" th:text="${error}" class="mt-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

    <form th:action="@{/clientes/guardar}" method="post" class="mt-6 space-y-5 rounded-2xl border border-[#ece6dc] bg-white p-6 shadow-sm">
        <input type="hidden" name="idCliente" th:value="${cliente.idCliente}">

        <div>
            <label for="nombre" class="block text-sm font-semibold mb-1">Nombre</label>
            <input id="nombre" type="text" name="nombre" maxlength="150" required
                   th:value="${cliente.nombre}"
                   class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
        </div>

        <div>
            <label for="direccion" class="block text-sm font-semibold mb-1">Dirección</label>
            <input id="direccion" type="text" name="direccion" maxlength="200"
                   th:value="${cliente.direccion}"
                   class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label for="nit" class="block text-sm font-semibold mb-1">NIT</label>
                <input id="nit" type="text" name="nit" maxlength="20"
                       th:value="${cliente.nit}"
                       class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
            </div>
            <div>
                <label for="fechaRegistro" class="block text-sm font-semibold mb-1">Fecha de registro</label>
                <input id="fechaRegistro" type="date" name="fechaRegistro" required
                       th:value="${cliente.fechaRegistro != null ? #temporals.format(cliente.fechaRegistro, 'yyyy-MM-dd') : #temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                       class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label for="correo" class="block text-sm font-semibold mb-1">Correo</label>
                <input id="correo" type="email" name="correo" maxlength="100"
                       th:value="${cliente.correo}"
                       class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
            </div>
            <div>
                <label for="telefono" class="block text-sm font-semibold mb-1">Teléfono</label>
                <input id="telefono" type="text" name="telefono" maxlength="20"
                       th:value="${cliente.telefono}"
                       class="w-full rounded-xl border-[#ece6dc] focus:border-[#c2652a] focus:ring-[#c2652a] text-sm">
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="px-4 py-2 rounded-xl bg-gradient-to-r from-[#c2652a] to-[#8a4518] text-white text-sm font-semibold shadow-sm hover:shadow-md nav-btn-transition">Guardar</button>
            <a th:href="@{/clientes}" class="px-4 py-2 rounded-xl border border-[#ece6dc] text-sm font-semibold text-[#605850] hover:bg-[#f2ece4] nav-btn-transition">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
